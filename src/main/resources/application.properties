spring.application.name=messagerie
spring.datasource.url=${MESSAGERIE_DB_URL:jdbc:mysql://localhost:3306/messagerie}
spring.datasource.username=${MESSAGERIE_DB_USER:messagerie}
spring.datasource.password=${MESSAGERIE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
